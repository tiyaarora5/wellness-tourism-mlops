name: MLOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/deployment/requirements.txt

      - name: Check project files
        run: |
          test -f tourism_project/deployment/Dockerfile
          test -f tourism_project/deployment/app.py
          test -f tourism_project/deployment/requirements.txt
          test -f tourism_project/model_building/best_model.pkl

      - name: Validate Python application
        run: |
          python -m py_compile tourism_project/deployment/app.py

      - name: Build Docker image
        run: |
          docker build \
            -f tourism_project/deployment/Dockerfile \
            -t wellness-tourism-app .
